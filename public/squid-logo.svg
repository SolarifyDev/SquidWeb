      <path d="M129 164C122 173 119 185 120 198C120 208 126 214 133 214C140 214 146 208 146 198C147 185 143 173 136 164C134 161 131 161 129 164Z"/>
      <path d="M145 160C154 166 161 177 163 189C165 198 160 205 153 203C143 200 137 188 135 175C134 168 138 157 145 160Z"/>
